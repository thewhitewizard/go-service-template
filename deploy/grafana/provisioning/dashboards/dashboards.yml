apiVersion: 1

providers:
  - name: service
    orgId: 1
    folder: Service
    type: file
    disableDeletion: false
    # Dashboards are code: edits made in the UI are overwritten on the next
    # reload. Change the JSON in this directory and commit it.
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
