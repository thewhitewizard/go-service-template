name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Drift guard: fails if go.mod/go.sum no longer match the real imports.
      # Without it, a dependency added locally but never tidied breaks the build
      # for the next person instead of for the one who introduced it.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - run: go build ./...

      - run: go vet ./...

      # -race, not plain go test: a data race is the failure mode that reproduces
      # only in production, and only under load.
      - name: Test with race detector
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # PINNED, not `latest`. With `latest`, a new linter release makes CI fail on a
      # commit that changed nothing, and — worse — a developer whose local binary is
      # older gets a green `make check` on code CI rejects. Two versions of the same
      # rule return two verdicts, and the one that blocks is the one nobody ran.
      #
      # Bump this deliberately, in a commit of its own, and tell the team to install
      # the same version (it is documented in README.md).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m

  # rename.ps1 cannot be exercised on a Linux runner, and a template's rename script
  # is run exactly once per new project — by someone who has no idea whether it
  # works. So the machine runs it, on Windows, on every push.
  #
  # The checkout is throwaway, so the real rename is performed rather than only the
  # dry run: the assertion that matters is that the renamed tree still builds and
  # its tests still pass.
  rename-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Dry run changes nothing
        shell: pwsh
        run: |
          $before = git status --porcelain
          ./rename.ps1 -ModuleNew github.com/acme/ci-rename-check -DryRun
          $after = git status --porcelain
          if ($before -ne $after) { throw "-DryRun modified the working tree" }

      - name: Rejects a malformed module path
        shell: pwsh
        run: |
          try {
            ./rename.ps1 -ModuleNew 'not a module path'
            throw "the script accepted a malformed module path"
          } catch {
            if ($_.Exception.Message -eq "the script accepted a malformed module path") { throw }
            Write-Host "rejected as expected: $($_.Exception.Message)"
          }

      - name: Rename for real
        shell: pwsh
        run: ./rename.ps1 -ModuleNew github.com/acme/ci-rename-check

      # The point of the whole job: a renamed tree that compiles and passes. The
      # script's own post-condition check already ran inside it.
      - name: The renamed tree still builds and tests
        shell: pwsh
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: No occurrence of the old name survives
        shell: pwsh
        run: |
          $hits = Select-String -Path (Get-ChildItem -Recurse -File -Force |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
              Select-Object -ExpandProperty FullName) -SimpleMatch -Pattern 'go-service-template' -List
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Path }
            throw "the old name survived the rename"
          }

  # The image is part of the deliverable, so a broken Dockerfile must fail CI and
  # not the deploy. Build only — no push: publishing is a release concern.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pins the guarantee the Dockerfile claims. A base image swap that silently
      # reverts to root would otherwise ship unnoticed.
      - name: Assert the image does not run as root
        run: |
          user="$(docker image inspect service:ci --format '{{.Config.User}}')"
          echo "image user: ${user:-<empty>}"
          case "$user" in
            ""|root|0|0:0) echo "::error::image runs as root"; exit 1 ;;
          esac
